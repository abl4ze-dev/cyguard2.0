# The %VARIABLES% are be replaced by actual values by the build script.
'name': 'cyguard'
'base': 'core22'
'version': '%VERSION%'
'summary': DNS-level cybersecurity and privacy protection
'description': |
  CYGUARD protects every device on a network at the DNS layer.  It blocks
  malicious, tracking, and unwanted domains without requiring client software
  on each device.  Administrators retain local control of configuration,
  filtering policy, activity data, and encrypted DNS endpoints.
'grade': 'stable'
'confinement': 'strict'
'architectures':
  - '%ARCH%'
'apps':
  'cyguard':
    'command': 'cyguard --no-check-update -w $SNAP_DATA'
    'plugs':
      # Add the "network-bind" plug to bind to interfaces.
      - 'network-bind'
      # Add the "network-observe" plug to be able to bind to ports below 1024
      # (cap_net_bind_service) and also to bind to a particular interface using
      # SO_BINDTODEVICE (cap_net_raw).
      - 'network-observe'
      # Add the "network-control" plug to be able to use raw sockets in the DHCP
      # server.
      #
      # TODO(a.garipov): If this works, request auto-connect of this plug.
      - 'network-control'
    'daemon': 'simple'
    'restart-condition': 'always'
  'cyguard-web':
    'command': 'adguard-home-web.sh'
    'plugs':
      - 'desktop'
